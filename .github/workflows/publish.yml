name: Publish packages

on:
  push:
    tags: ["genjobs-core-v*", "genjobs-local-v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Determine package
        id: target
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package="${TAG_NAME%-v*}"
          version="${TAG_NAME##*-v}"
          case "$package" in genjobs-core|genjobs-local) ;; *) exit 1 ;; esac
          metadata_version=$(sed -n 's/^version = "\(.*\)"/\1/p' "packages/$package/pyproject.toml" | head -1)
          test "$version" = "$metadata_version"
          echo "package=$package" >> "$GITHUB_OUTPUT"
      - name: Build
        run: python -m pip install --upgrade build && python -m build "packages/${{ steps.target.outputs.package }}"
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: packages/${{ steps.target.outputs.package }}/dist/
