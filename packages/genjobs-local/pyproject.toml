[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genjobs-local"
version = "0.1.0"
description = "Local development and test backends for GenJobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "GenJobs contributors" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = ["genjobs-core>=0.1.0,<0.2.0"]

[tool.uv.sources]
genjobs-core = { workspace = true }

[project.urls]
Documentation = "https://github.com/surya-mp/genjobs/tree/main/docs"
Source = "https://github.com/surya-mp/genjobs"
Issues = "https://github.com/surya-mp/genjobs/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/genjobs_local"]
