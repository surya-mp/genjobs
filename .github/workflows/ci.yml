name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages and checks
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e packages/genjobs-core -e packages/genjobs-local
          pytest pytest-asyncio ruff pyright build twine
      - name: Format and lint
        run: ruff format --check . && ruff check .
      - name: Type check
        run: pyright
      - name: Test
        run: pytest
      - name: Build distributions
        run: |
          for package in packages/*; do python -m build "$package"; done
      - name: Validate package metadata
        run: twine check packages/*/dist/*

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install mkdocs-material
      - run: mkdocs build --strict
