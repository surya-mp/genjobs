name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install packages and checks
        run: >-
          python -m pip install --upgrade pip
          && python -m pip install -e packages/genjobs-core -e packages/genjobs-local
          pytest pytest-asyncio ruff pyright build twine pip-audit cyclonedx-bom
      - name: Format and lint
        run: ruff format --check . && ruff check .
      - name: Type check
        run: pyright
      - name: Test
        run: pytest
      - name: Build distributions
        run: |
          for package in packages/*; do python -m build "$package"; done
      - name: Validate package metadata
        run: twine check packages/*/dist/*
      - name: Audit dependencies
        run: pip-audit --strict
      - name: Generate SBOM
        run: cyclonedx-py environment --of JSON --output-reproducible --output-file sbom.json

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.1.7
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install mkdocs-material
      - run: mkdocs build --strict
